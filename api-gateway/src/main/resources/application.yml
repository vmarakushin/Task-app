server:
  port: 8080

spring:
  cloud:
    gateway:
      httpclient:
        wiretap: true
      httpserver:
        wiretap: true
      routes:
        - id: auth_route
          uri: http://${AUTH_SERVICE_HOST:localhost}:${AUTH_SERVICE_PORT:8081}
          predicates:
            - Path=/registration, /login
          filters:
            - RewritePath=/(?<segment>.*), /api/auth/$\{segment}

        - id: task_route
          uri: http://${TASK_SERVICE_HOST:localhost}:${TASK_SERVICE_PORT:8083}
          predicates:
            - Path=/api/tasks/**
          filters:
            - TokenVerificationFilterFactory

        - id: accounting-route
          uri: http://${ACCOUNTING_SERVICE_HOST:localhost}:${ACCOUNTING_SERVICE_PORT:8084}
          predicates:
            - Path=/api/balance/**
          filters:
            - TokenVerificationFilterFactory

        - id: search-route
          uri: http://${SEARCH_SERVICE_HOST:localhost}:${SEARCH_SERVICE_PORT:8085}
          predicates:
            - Path=/api/search/**
          filters:
            - TokenVerificationFilterFactory

keycloak:
  url: http://${KEYCLOAK_HOST:localhost}:${KEYCLOAK_PORT:8082}/realms/${REALM:demo}/protocol/openid-connect/userinfo
