server:
  port: 8080

spring:
  cloud:
    gateway:
      httpclient:
        wiretap: true
      httpserver:
        wiretap: true
      # Аутентификация и проверка роли - в SecurityConfig, заголовки пользователя - в UserHeadersFilter
      routes:
        - id: auth_route
          uri: http://${AUTH_SERVICE_HOST:localhost}:${AUTH_SERVICE_PORT:8081}
          predicates:
            - Path=/registration, /login
          filters:
            - RewritePath=/(?<segment>.*), /api/auth/$\{segment}

        - id: task_route
          uri: http://${TASK_SERVICE_HOST:localhost}:${TASK_SERVICE_PORT:8083}
          predicates:
            - Path=/api/tasks/**

        - id: accounting-route
          uri: http://${ACCOUNTING_SERVICE_HOST:localhost}:${ACCOUNTING_SERVICE_PORT:8084}
          predicates:
            - Path=/api/balance/**

        - id: search-route
          uri: http://${SEARCH_SERVICE_HOST:localhost}:${SEARCH_SERVICE_PORT:8085}
          predicates:
            - Path=/api/search/**

security:
  jwt:
    # Токены выдаёт Keycloak по внутреннему адресу (auth-service ходит на keycloak:8080),
    # поэтому iss в токене строится из того же адреса.
    issuer: http://${KEYCLOAK_HOST:localhost}:${KEYCLOAK_PORT:8082}/realms/${REALM:demo}
    jwk-set-uri: http://${KEYCLOAK_HOST:localhost}:${KEYCLOAK_PORT:8082}/realms/${REALM:demo}/protocol/openid-connect/certs

management:
  endpoints:
    web:
      exposure:
        include: health
