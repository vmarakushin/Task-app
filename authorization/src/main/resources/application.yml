server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://${DB_URL_ALIAS:localhost}:5432/auth_service
    username: postgres
    password: postgres
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate

jwt:
  secret: ${JWT_SECRET:change-me-in-production-use-at-least-256-bit-secret-key!!}
  expiration-ms: 86400000
