server:
  port: ${AUTH_SERVICE_PORT:8081}

keycloak:
  url: http://${KEYCLOAK_HOST:localhost}:${KEYCLOAK_PORT:8082}
  realm: ${REALM:demo}
  client-id: auth-service
  client-secret: auth-secret

spring:
  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost}:${KAFKA_PORT:29092}
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      # Задаёт транзакционный продюсер: Spring Boot сделает KafkaTemplate транзакционным.
      transaction-id-prefix: auth-tx-
      properties:
        enable.idempotence: true
        # Если Kafka недоступна, регистрация должна быстро вернуть 503,
        # а не висеть по минуте (значения Kafka по умолчанию: 60 с и 2 мин).
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true

info:
  app:
    name: "Auth Service"
