server:
  port: ${AUTH_SERVICE_PORT:8081}

keycloak:
  url: http://${KEYCLOAK_HOST:localhost}:${KEYCLOAK_PORT:8082}
  realm: ${REALM:demo}
  client-id: auth-service
  client-secret: auth-secret

spring:
  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost}:${KAFKA_PORT:29092}
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true

info:
  app:
    name: "Auth Service"
