services:

  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./databases.sql:/docker-entrypoint-initdb.d/databases.sql
    networks:
      - task-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CLUSTER_ID: <generated-uuid>
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/apache/kafka
    networks:
      - task-net
    healthcheck:
      test: [ "CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list" ]
      interval: 10s
      timeout: 10s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      KC_HTTP_PORT: 8082
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import
##    ports:
##      - "8082:8082"
    networks:
      - task-net

  task-service:
    build:
      context: .
      dockerfile: task-service/dockerfile
    container_name: task-service
##    ports:
##      - "8083:8083"
    environment:
      DB_URL_ALIAS: postgres
      KAFKA_URL_ALIAS: postgres
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - task-net

  auth-service:
    build:
      context: .
      dockerfile: auth-service/dockerfile
    container_name: auth-service
##    ports:
##      - "8081:8081"
    environment:
      JWT_SECRET: change-me-in-production-use-at-least-256-bit-secret-key!!
      DB_URL_ALIAS: postgres
      KEYCLOAK_URL_ALIAS: keycloak
      KAFKA_URL_ALIAS: kafka
    depends_on:
      postgres:
        condition: service_healthy
      task-service:
        condition: service_started
    networks:
      - task-net

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      AUTH_SERVICE_URL_ALIAS: auth-service
      TASK_SERVICE_URL_ALIAS: task-service
      KEYCLOAK_URL_ALIAS: keycloak
      REALM: demo
    depends_on:
      auth-service:
        condition: service_started
      task-service:
        condition: service_started
    networks:
      - task-net


networks:
  task-net:

volumes:
  postgres_data:
  kafka_data:
