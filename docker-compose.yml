services:

  task-db:
    image: postgres:16
    container_name: "${TASK_DB_HOST:-task-db}"
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${TASK_DB_USER:-postgres}"
      POSTGRES_PASSWORD: "${TASK_DB_PASSWORD:-postgres}"
      POSTGRES_DB: "${TASK_DB_NAME:-task_service}"
    volumes:
      - task_postgres_data:/var/lib/postgresql/data
#    ports:
#      - "5432:5432"
    networks:
      - task-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak-db:
    image: postgres:16
    container_name: "${KEYCLOAK_DB_HOST:-keycloak-db}"
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${KEYCLOAK_DB_USER:-postgres}"
      POSTGRES_PASSWORD: "${KEYCLOAK_DB_PASSWORD:-postgres}"
      POSTGRES_DB: "${KEYCLOAK_DB_NAME:-keycloak}"
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
#    ports:
#      - "5433:5432"
    networks:
      - task-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  accounting-db:
    image: postgres:16
    container_name: "${ACCOUNTING_DB_HOST:-accounting-db}"
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${ACCOUNTING_DB_USER:-postgres}"
      POSTGRES_PASSWORD: "${ACCOUNTING_DB_PASSWORD:-postgres}"
      POSTGRES_DB: "${ACCOUNTING_DB_NAME:-accounting_service}"
    volumes:
      - accounting_postgres_data:/var/lib/postgresql/data
#    ports:
#      - "5434:5432"
    networks:
      - task-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  search-db:
    image: postgres:16
    container_name: "${SEARCH_DB_HOST:-search-db}"
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${SEARCH_DB_USER:-postgres}"
      POSTGRES_PASSWORD: "${SEARCH_DB_PASSWORD:-postgres}"
      POSTGRES_DB: "${SEARCH_DB_NAME:-search_service}"
    volumes:
      - search_postgres_data:/var/lib/postgresql/data
#    ports:
#      - "5435:5432"
    networks:
      - task-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    container_name: "${KAFKA_HOST:-kafka}"
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CLUSTER_ID: OO77msMOR1-AH_TDLmxTvw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
#    ports:
#      - "29092:29092"
    networks:
      - task-net
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: "${KEYCLOAK_HOST:-keycloak}"
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KEYCLOAK_ADMIN_USERNAME:-admin}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:-admin}"
      KC_HTTP_ENABLED: true
      KC_DB: postgres
      KC_DB_URL: "jdbc:postgresql://${KEYCLOAK_DB_HOST:-keycloak-db}:${KEYCLOAK_DB_PORT:-5432}/${KEYCLOAK_DB_NAME:-keycloak}"
      KC_DB_USERNAME: "${KEYCLOAK_DB_USER:-postgres}"
      KC_DB_PASSWORD: "${KEYCLOAK_DB_PASSWORD:-postgres}"
      KC_HTTP_PORT: "${KEYCLOAK_PORT:-8080}"
      KEYCLOAK_CLIENT_SECRET: "${KEYCLOAK_CLIENT_SECRET:-auth-secret}"
      KC_HEALTH_ENABLED: true
    depends_on:
      keycloak-db:
        condition: service_healthy
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3" ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
#    ports:
#      - "8082:8080"
    networks:
      - task-net

  task-service:
    build:
      context: .
      dockerfile: task-service/dockerfile
    container_name: "${TASK_SERVICE_HOST:-task-service}"
#    ports:
#      - "8083:8080"
    environment:
      TASK_DB_HOST: "${TASK_DB_HOST:-task-db}"
      TASK_DB_PORT: "${TASK_DB_PORT:-5432}"
      TASK_DB_NAME: "${TASK_DB_NAME:-task_service}"
      TASK_DB_USER: "${TASK_DB_USER:-postgres}"
      TASK_DB_PASSWORD: "${TASK_DB_PASSWORD:-postgres}"
      TASK_SERVICE_PORT: "${TASK_SERVICE_PORT:-8080}"
      KAFKA_HOST: "${KAFKA_HOST:-kafka}"
      KAFKA_PORT: "${KAFKA_PORT:-9092}"
    depends_on:
      task-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:${TASK_SERVICE_PORT:-8080}/actuator/health | grep -q UP" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - task-net

  auth-service:
    build:
      context: .
      dockerfile: auth-service/dockerfile
    container_name: "${AUTH_SERVICE_HOST:-auth-service}"
#    ports:
#      - "8081:8080"
    environment:
      AUTH_SERVICE_PORT: "${AUTH_SERVICE_PORT:-8080}"
      KEYCLOAK_HOST: "${KEYCLOAK_HOST:-keycloak}"
      KEYCLOAK_PORT: "${KEYCLOAK_PORT:-8080}"
      KAFKA_HOST: "${KAFKA_HOST:-kafka}"
      KAFKA_PORT: "${KAFKA_PORT:-9092}"
      REALM: "${REALM:-demo}"
      KEYCLOAK_CLIENT_SECRET: "${KEYCLOAK_CLIENT_SECRET:-auth-secret}"
    depends_on:
      keycloak:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:${AUTH_SERVICE_PORT:-8080}/actuator/health | grep -q UP" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - task-net

  accounting-service:
    build:
      context: .
      dockerfile: accounting-service/dockerfile
    container_name: "${ACCOUNTING_SERVICE_HOST:-accounting-service}"
#    ports:
#      - "8084:8080"
    environment:
      ACCOUNTING_DB_HOST: "${ACCOUNTING_DB_HOST:-accounting-db}"
      ACCOUNTING_DB_PORT: "${ACCOUNTING_DB_PORT:-5432}"
      ACCOUNTING_DB_NAME: "${ACCOUNTING_DB_NAME:-accounting_service}"
      ACCOUNTING_DB_USER: "${ACCOUNTING_DB_USER:-postgres}"
      ACCOUNTING_DB_PASSWORD: "${ACCOUNTING_DB_PASSWORD:-postgres}"
      ACCOUNTING_SERVICE_PORT: "${ACCOUNTING_SERVICE_PORT:-8080}"
      KAFKA_HOST: "${KAFKA_HOST:-kafka}"
      KAFKA_PORT: "${KAFKA_PORT:-9092}"
      ACCOUNTING_PAYMENT_AMOUNT: "${ACCOUNTING_PAYMENT_AMOUNT:-1000.00}"
      ACCOUNTING_PAYOUT_CRON: "${ACCOUNTING_PAYOUT_CRON:-0 0 0 * * FRI}"
      ACCOUNTING_PAYOUT_ANCHOR_DATE: "${ACCOUNTING_PAYOUT_ANCHOR_DATE:-}"
      ACCOUNTING_OUTBOX_BATCH_SIZE: "${ACCOUNTING_OUTBOX_BATCH_SIZE:-100}"
      ACCOUNTING_OUTBOX_INTERVAL_SEC: "${ACCOUNTING_OUTBOX_INTERVAL_SEC:-10}"
      TZ: "${TZ:-UTC}"
    depends_on:
      accounting-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:${ACCOUNTING_SERVICE_PORT:-8080}/actuator/health | grep -q UP" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - task-net

  search-service:
    build:
      context: .
      dockerfile: search-service/dockerfile
    container_name: "${SEARCH_SERVICE_HOST:-search-service}"
#    ports:
#      - "8085:8080"
    environment:
      SEARCH_DB_HOST: "${SEARCH_DB_HOST:-search-db}"
      SEARCH_DB_PORT: "${SEARCH_DB_PORT:-5432}"
      SEARCH_DB_NAME: "${SEARCH_DB_NAME:-search_service}"
      SEARCH_DB_USER: "${SEARCH_DB_USER:-postgres}"
      SEARCH_DB_PASSWORD: "${SEARCH_DB_PASSWORD:-postgres}"
      SEARCH_SERVICE_PORT: "${SEARCH_SERVICE_PORT:-8080}"
      KAFKA_HOST: "${KAFKA_HOST:-kafka}"
      KAFKA_PORT: "${KAFKA_PORT:-9092}"
    depends_on:
      search-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:${SEARCH_SERVICE_PORT:-8080}/actuator/health | grep -q UP" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - task-net

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      AUTH_SERVICE_HOST: "${AUTH_SERVICE_HOST:-auth-service}"
      AUTH_SERVICE_PORT: "${AUTH_SERVICE_PORT:-8080}"
      TASK_SERVICE_HOST: "${TASK_SERVICE_HOST:-task-service}"
      TASK_SERVICE_PORT: "${TASK_SERVICE_PORT:-8080}"
      ACCOUNTING_SERVICE_HOST: "${ACCOUNTING_SERVICE_HOST:-accounting-service}"
      ACCOUNTING_SERVICE_PORT: "${ACCOUNTING_SERVICE_PORT:-8080}"
      SEARCH_SERVICE_HOST: "${SEARCH_SERVICE_HOST:-search-service}"
      SEARCH_SERVICE_PORT: "${SEARCH_SERVICE_PORT:-8080}"
      KEYCLOAK_HOST: "${KEYCLOAK_HOST:-keycloak}"
      KEYCLOAK_PORT: "${KEYCLOAK_PORT:-8080}"
      REALM: "${REALM:-demo}"
    depends_on:
      auth-service:
        condition: service_healthy
      task-service:
        condition: service_healthy
      accounting-service:
        condition: service_healthy
      search-service:
        condition: service_healthy
    networks:
      - task-net

networks:
  task-net:

volumes:
  task_postgres_data:
  keycloak_postgres_data:
  kafka_data:
  accounting_postgres_data:
  search_postgres_data:
