services:

  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./databases.sql:/docker-entrypoint-initdb.d/databases.sql
    networks:
      - task-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CLUSTER_ID: <generated-uuid>
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/apache/kafka
    networks:
      - task-net
    healthcheck:
      test: [ "CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list" ]
      interval: 10s
      timeout: 10s
      retries: 10

  task-app:
    build:
      context: .
      dockerfile: task-application/dockerfile
    container_name: task-app
    ports:
      - "8080:8080"
    environment:
      DB_URL_ALIAS: postgres
      KAFKA_URL_ALIAS: kafka
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - task-net

  auth-app:
    build:
      context: .
      dockerfile: authorization/dockerfile
    container_name: auth-app
    ports:
      - "8081:8081"
    environment:
      JWT_SECRET: change-me-in-production-use-at-least-256-bit-secret-key!!
      DB_URL_ALIAS: postgres
    depends_on:
      postgres:
        condition: service_healthy
      task-app:
        condition: service_started
    networks:
      - task-net

networks:
  task-net:

volumes:
  postgres_data:
  kafka_data:
