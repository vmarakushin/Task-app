spring:
  datasource:
    url: jdbc:postgresql://${SEARCH_DB_HOST:localhost}:${SEARCH_DB_PORT:5435}/${SEARCH_DB_NAME:search_service}
    username: ${SEARCH_DB_USER:postgres}
    password: ${SEARCH_DB_PASSWORD:postgres}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate

  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost}:${KAFKA_PORT:29092}
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true

    consumer:
      group-id: search-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
    properties:
      spring.json.trusted.packages: "*"

    listener:
      ack-mode: manual_immediate

server:
  port: ${SEARCH_SERVICE_PORT:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true

info:
  app:
    name: "Search Service"
